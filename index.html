<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0E1420" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="5AM" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230E1420'/%3E%3Cpath d='M20 66h60' stroke='%23F6B549' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='48' r='16' fill='none' stroke='%23F6B549' stroke-width='6'/%3E%3C/svg%3E" />
<title>5AM WOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0E1420;--surface:#172033;--surface-2:#1F2A42;--line:rgba(255,255,255,0.08);--text:#E8ECF4;--muted:#93A0B8;--gold:#F6B549;--gold-soft:#F5A623;--coral:#E8724C;--green:#6FCF97;--blue:#6BA8D6;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px);-webkit-font-smoothing:antialiased;}
  body.locked{overflow:hidden;}
  .wrap{max-width:600px;margin:0 auto;padding:0 18px;}

  .hero{padding:30px 0 4px;}
  .sunbar{height:4px;width:64px;border-radius:4px;background:linear-gradient(90deg,var(--coral),var(--gold));margin-bottom:18px;}
  .eyebrow{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;font-size:12.5px;color:var(--gold);}
  .date{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,7.5vw,40px);line-height:1.05;margin:6px 0 2px;}
  .subline{color:var(--muted);font-size:13.5px;}

  .toggles{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;}
  .toggle-row{display:flex;align-items:center;gap:9px;}
  .switch{position:relative;width:46px;height:26px;flex:0 0 46px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:background .2s;}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:transform .2s,background .2s;}
  .switch input:checked + .slider{background:rgba(111,207,151,0.25);}
  .switch input:checked + .slider:before{transform:translateX(20px);background:var(--green);}
  .switch input:focus-visible + .slider{outline:3px solid var(--gold);outline-offset:2px;}
  .toggle-label{font-size:13.5px;color:var(--muted);}

  .progress{margin:20px 0 4px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-family:'Oswald',sans-serif;letter-spacing:0.08em;text-transform:uppercase;}
  .bar{flex:1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .35s ease;}

  .blockhead{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;}
  .blocktag{display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;font-size:14px;color:var(--bg);background:var(--gold);border-radius:8px;padding:4px 11px;}
  .blocktag.warm{background:var(--blue);color:#08111d;}
  .blocktag.fin{background:var(--coral);color:#fff;}
  .blocktag.light{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .blockmeta{font-family:'Oswald',sans-serif;letter-spacing:0.06em;text-transform:uppercase;font-size:12px;color:var(--muted);margin:9px 0 7px;}
  .blockhow{font-size:14px;color:var(--text);}
  .benchname{font-family:'Oswald',sans-serif;font-size:19px;color:var(--coral);margin:8px 0 6px;letter-spacing:0.02em;}

  .ex{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:opacity .2s ease;}
  .ex.done{opacity:0.42;}
  .ex.done .ex-name{text-decoration:line-through;}
  .check{flex:0 0 26px;width:26px;height:26px;margin-top:2px;border-radius:8px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .15s,background .15s;}
  .ex.done .check{border-color:var(--green);background:var(--green);}
  .check svg{width:15px;height:15px;opacity:0;}
  .ex.done .check svg{opacity:1;}
  .check:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-family:'Oswald',sans-serif;font-weight:500;font-size:17.5px;letter-spacing:0.01em;}
  .ex-rep{color:var(--gold);font-size:14px;font-weight:600;margin-top:2px;}
  .ex-note{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .ex-watch{display:inline-block;margin-top:7px;font-size:12px;color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(107,168,214,0.35);}
  .pairtag{display:inline-block;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-bottom:5px;}

  .flag{margin:12px 0 4px;font-size:12.5px;color:var(--coral);border-left:3px solid var(--coral);padding:5px 0 5px 12px;background:rgba(232,114,76,0.06);border-radius:0 8px 8px 0;}

  .btn{display:block;width:100%;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;font-size:15px;padding:15px;border-radius:14px;border:none;cursor:pointer;margin:4px 0 22px;background:var(--gold);color:#0E1420;}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(246,181,73,0.45);}

  .sec-label{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:10px;}
  .sec-label:after{content:"";flex:1;height:1px;background:var(--line);}

  .opt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px;}
  .opt-tool{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;letter-spacing:0.02em;}
  .opt-time{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-top:1px;}
  .opt-how{font-size:13.5px;color:var(--muted);margin-top:7px;}
  .opt-where{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic;}
  .opt .btn{margin:13px 0 0;padding:12px;font-size:13.5px;}

  .rest{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 18px;text-align:center;margin-top:22px;}
  .rest h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;margin:0 0 6px;letter-spacing:0.02em;}
  .rest p{color:var(--muted);font-size:14px;margin:0;}

  .week{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .wrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);}
  .wrow:last-child{border-bottom:none;}
  .wrow.now{background:var(--surface-2);}
  .wday{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;font-size:13px;width:44px;flex:0 0 44px;color:var(--muted);}
  .wrow.now .wday{color:var(--gold);}
  .wtext{font-size:13.5px;color:var(--text);flex:1;min-width:0;}
  .wtext em{color:var(--muted);font-style:normal;}

  .score{margin-top:12px;}
  .score label{display:block;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .score input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;font-family:'Inter',sans-serif;}
  .score input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .score .prev{font-size:12px;color:var(--muted);margin-top:6px;}

  .foot{margin-top:30px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7;}

  /* Timer takeover */
  .timer{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 20px);}
  .timer.on{display:flex;}
  .t-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .t-title{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;font-size:13px;color:var(--muted);}
  .t-close{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 13px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  .t-close:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .t-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .t-phase{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;font-size:clamp(30px,10vw,52px);line-height:1.05;color:var(--gold);}
  .t-phase.rest{color:var(--blue);}
  .t-phase.go{color:var(--green);}
  .t-clock{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(84px,30vw,160px);line-height:1;letter-spacing:0.01em;font-variant-numeric:tabular-nums;margin:6px 0 4px;}
  .t-sub{font-size:15px;color:var(--muted);max-width:400px;}
  .t-count{font-family:'Oswald',sans-serif;letter-spacing:0.16em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:14px;}
  .t-track{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:22px;}
  .t-track>i{display:block;height:100%;width:0%;background:var(--gold);}
  .t-track>i.rest{background:var(--blue);}
  .t-track>i.go{background:var(--green);}
  .t-btns{display:flex;gap:10px;margin-top:16px;}
  .t-btns button{flex:1;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;font-size:14px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;}
  .t-btns button.primary{background:var(--gold);color:#0E1420;border-color:var(--gold);}
  .t-btns button:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  @media (prefers-reduced-motion:reduce){
    .slider,.slider:before,.bar>i,.ex,.check{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="sunbar"></div>
    <div class="eyebrow" id="eyebrow">Today</div>
    <h1 class="date" id="dateline">Loading</h1>
    <div class="subline" id="subline"></div>

    <div class="toggles" id="toggles">
      <div class="toggle-row">
        <label class="switch"><input type="checkbox" id="noimpact" /><span class="slider"></span></label>
        <span class="toggle-label">No impact today</span>
      </div>
      <div class="toggle-row">
        <label class="switch"><input type="checkbox" id="shortday" /><span class="slider"></span></label>
        <span class="toggle-label">Short day</span>
      </div>
    </div>
  </div>

  <div class="progress" id="progressWrap" style="display:none;">
    <span id="progressText">0 of 0</span>
    <span class="bar"><i id="progressBar"></i></span>
  </div>

  <div id="main"></div>

  <div class="sec-label">This week</div>
  <div class="week" id="week"></div>

  <div class="foot">
    Tuesday and Thursday are the plan.<br />Monday, Wednesday and Friday are optional.
  </div>
</div>

<div class="timer" id="timer" role="dialog" aria-modal="true" aria-label="Workout timer">
  <div class="t-top">
    <div class="t-title" id="tTitle">Timer</div>
    <button class="t-close" id="tClose">Close</button>
  </div>
  <div class="t-mid">
    <div class="t-phase" id="tPhase">Ready</div>
    <div class="t-clock" id="tClock">0:10</div>
    <div class="t-sub" id="tSub"></div>
    <div class="t-count" id="tCount"></div>
  </div>
  <div class="t-track"><i id="tTrack"></i></div>
  <div class="t-btns">
    <button id="tToggle" class="primary">Start</button>
    <button id="tSkip">Skip</button>
  </div>
</div>

<script>
/* ---------- deterministic randomness ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- calendar ---------- */
var START=new Date(2026,7,24); /* Monday Aug 24 2026 = Block 1, Week 1 */
function stripTime(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dayIndex(d){return Math.floor((stripTime(d)-START)/86400000);}
function weekIndex(d){var n=dayIndex(d);return n<0?0:Math.floor(n/7);}
function blockIndex(d){return Math.floor(weekIndex(d)/4);}
function weekInBlock(d){return weekIndex(d)%4;}
function mondayOf(d){var w=weekIndex(d);return new Date(START.getFullYear(),START.getMonth(),START.getDate()+w*7);}

/* ---------- equipment ----------
   Kettlebells: 15, 15, 25, 35, 50
   Dumbbells (pairs): 3, 5, 10, 15, 25, 35, 45
   Flat bench, Concept2 RowERG, rebounder, walking pad
   Swings and other ballistics capped at 35 lb, permanently.
------------------------------------ */
function yt(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q);}

/* ---------- strength anchors ---------- */
var SQUAT=[
 {id:"goblet",name:"Goblet squat",load:[35,50],unit:"lb kettlebell",base:6,q:"goblet squat kettlebell form",cue:"Bell at your chest, elbows in, sit down between your knees."},
 {id:"dbfront",name:"Double dumbbell front squat",load:[25,35],unit:"lb dumbbells",base:6,q:"double dumbbell front squat form",cue:"Dumbbells on your shoulders, chest tall."},
 {id:"split",name:"Rear-foot elevated split squat",load:[15,25,35],unit:"lb dumbbells",base:5,unil:true,q:"rear foot elevated split squat dumbbell",cue:"Back foot on the bench, front shin vertical."},
 {id:"stepup",name:"Bench step-up",load:[15,25,35],unit:"lb dumbbells",base:6,unil:true,q:"dumbbell step up bench form",cue:"Drive through the whole foot, no push off the back leg."},
 {id:"revlunge",name:"Reverse lunge",load:[15,25,35],unit:"lb dumbbells",base:6,unil:true,q:"dumbbell reverse lunge form",cue:"Step back, knee to the floor softly, stand tall."}
];
var HINGE=[
 {id:"kbdl",name:"Kettlebell deadlift",load:[35,50],unit:"lb kettlebell",base:6,q:"kettlebell deadlift form beginner",cue:"Push your hips back, flat back, squeeze at the top."},
 {id:"rdl",name:"Dumbbell Romanian deadlift",load:[25,35,45],unit:"lb dumbbells",base:6,q:"dumbbell romanian deadlift form",cue:"Soft knees, hips travel back, feel it in the hamstrings."},
 {id:"sldl",name:"Single-leg deadlift",load:[15,25,35],unit:"lb kettlebell",base:5,unil:true,q:"single leg deadlift kettlebell form",cue:"Hips square, back leg long, slow on the way down."},
 {id:"hipthrust",name:"Bench hip thrust",load:[35,50],unit:"lb kettlebell",base:8,q:"bench hip thrust kettlebell form",cue:"Shoulders on the bench, ribs down, squeeze glutes at the top."},
 {id:"swing",name:"Kettlebell swing",load:[25,35],unit:"lb kettlebell",base:10,impact:true,q:"kettlebell swing form beginner",cue:"Hips snap, not a squat. Bell floats, arms stay relaxed."}
];
var PUSH=[
 {id:"sapress",name:"Single-arm overhead press",load:[25,35],unit:"lb kettlebell",base:5,unil:true,q:"single arm kettlebell press form",cue:"Ribs down, brace hard, press straight up."},
 {id:"dbbench",name:"Dumbbell bench press",load:[25,35,45],unit:"lb dumbbells",base:6,q:"dumbbell bench press form",cue:"Elbows about 45 degrees, control the way down."},
 {id:"floorpress",name:"Dumbbell floor press",load:[25,35,45],unit:"lb dumbbells",base:7,q:"dumbbell floor press form",cue:"Triceps touch the floor, then press. Easy on the shoulders."},
 {id:"dbpress",name:"Standing dumbbell overhead press",load:[15,25,35],unit:"lb dumbbells",base:6,q:"standing dumbbell overhead press form",cue:"Squeeze glutes, don't lean back."},
 {id:"pushup",name:"Push-up",load:[0],unit:"bodyweight",base:8,q:"push up form beginner progression",cue:"Knees or hands on the bench is fine. Full range beats full reps."},
 {id:"hkpress",name:"Half-kneeling press",load:[25,35],unit:"lb kettlebell",base:5,unil:true,q:"half kneeling kettlebell press form",cue:"Back knee down, tuck the ribs, press without arching."}
];
var PULL=[
 {id:"bentrow",name:"Bent-over row",load:[25,35,45],unit:"lb dumbbells",base:8,q:"dumbbell bent over row form",cue:"Hinge to about 45 degrees, pull to the ribs, don't shrug."},
 {id:"sarow",name:"Bench-supported single-arm row",load:[25,35,45],unit:"lb dumbbell",base:7,unil:true,q:"single arm dumbbell row bench form",cue:"One hand on the bench, pull the elbow past your ribs."},
 {id:"renegade",name:"Renegade row",load:[15,25],unit:"lb dumbbells",base:5,unil:true,q:"renegade row dumbbell form",cue:"Wide feet, hips still. Core work as much as back work."},
 {id:"gorilla",name:"Gorilla row",load:[35,50],unit:"lb kettlebell",base:6,unil:true,q:"gorilla row kettlebell form",cue:"Hinged over, one bell on the floor, row and switch."},
 {id:"highpull",name:"Kettlebell high pull",load:[25,35],unit:"lb kettlebell",base:8,impact:true,q:"kettlebell high pull form",cue:"Hip snap first, elbow leads. Stop if it feels like a shoulder move."}
];

/* ---------- finisher movement pool ---------- */
var FIN=[
 {id:"row",name:"Row",unit:"cal",kind:"cal",q:"concept2 rower form beginner"},
 {id:"rowm",name:"Row",unit:"m",kind:"meters",q:"concept2 rower form beginner"},
 {id:"rebound",name:"Mini trampoline bounce",kind:"hold",q:"mini trampoline workout beginner"},
 {id:"pushup",name:"Push-up",kind:"rep",q:"push up form beginner progression"},
 {id:"plank",name:"Plank",kind:"hold",q:"plank form beginner"},
 {id:"sideplank",name:"Side plank",kind:"hold",unil:true,q:"side plank form beginner"},
 {id:"hollow",name:"Hollow hold",kind:"hold",q:"hollow body hold form beginner"},
 {id:"deadbug",name:"Dead bug",kind:"rep",unil:true,q:"dead bug exercise form"},
 {id:"birddog",name:"Bird dog",kind:"rep",unil:true,q:"bird dog exercise form"},
 {id:"glutebridge",name:"Glute bridge",kind:"rep",q:"glute bridge form"},
 {id:"mtnclimb",name:"Mountain climber",kind:"rep",q:"mountain climber form"},
 {id:"bwsquat",name:"Bodyweight squat",kind:"rep",q:"bodyweight squat form"},
 {id:"bwlunge",name:"Reverse lunge",kind:"rep",unil:true,q:"bodyweight reverse lunge form"},
 {id:"stepup",name:"Bench step-up",kind:"rep",unil:true,q:"bench step up bodyweight"},
 {id:"situp",name:"Sit-up",kind:"rep",q:"sit up form"},
 {id:"twist",name:"Russian twist, 15 lb",kind:"rep",q:"russian twist kettlebell form"},
 {id:"farmer",name:"Farmer hold, 35 lb dumbbells",kind:"hold",q:"farmer hold dumbbell form"},
 {id:"gobsquat",name:"Goblet squat, 25 lb",kind:"rep",q:"goblet squat kettlebell form"},
 {id:"kbdl",name:"Kettlebell deadlift, 50 lb",kind:"rep",q:"kettlebell deadlift form beginner"},
 {id:"swing",name:"Kettlebell swing, 35 lb",kind:"rep",impact:true,q:"kettlebell swing form beginner"},
 {id:"jack",name:"Jumping jack",kind:"rep",impact:true,q:"jumping jacks form"},
 {id:"burpee",name:"Burpee, step back",kind:"rep",impact:true,q:"step back burpee beginner"}
];

/* ---------- named benchmarks, fixed loads, repeat every block ---------- */
var BENCH=[
 {name:"The Sourdough",type:"amrap",mins:6,how:"As many rounds as you can in 6 minutes. Write down your rounds.",
  items:[{t:"10 kettlebell deadlifts, 50 lb",q:"kettlebell deadlift form beginner"},{t:"8 push-ups",q:"push up form beginner progression"},{t:"10 cal row",q:"concept2 rower form beginner"}]},
 {name:"Dawn Patrol",type:"amrap",mins:7,how:"As many rounds as you can in 7 minutes. Write down your rounds.",
  items:[{t:"200 m row",q:"concept2 rower form beginner"},{t:"10 goblet squats, 35 lb",q:"goblet squat kettlebell form"},{t:"10 bench step-ups, 5 each side",q:"bench step up bodyweight"}]},
 {name:"Fort Morgan",type:"emom",mins:6,how:"Every minute on the minute for 6 minutes. Rest whatever is left of each minute. Write down the last minute you finished clean.",
  items:[{t:"Odd minutes: 12 cal row",q:"concept2 rower form beginner"},{t:"Even minutes: 10 bent-over rows, 25 lb",q:"dumbbell bent over row form"}]}
];

/* ---------- optional light day cards ---------- */
var WALK=[
 {time:"15 min",how:"Steady, comfortable pace. Take a call or listen to something.",},
 {time:"12 min",how:"Every 3 minutes, bump the speed up for 30 seconds, then back down.",timer:[["Easy",150],["Faster",30],["Easy",150],["Faster",30],["Easy",150],["Faster",30],["Easy",150],["Faster",30]]},
 {time:"20 min",how:"Easy pace, no target. Stack it on a report running or a client call."},
 {time:"10 min",how:"Steady, but bump the incline if you have one. Short and done."}
];
var REB=[
 {time:"9 min",how:"1 minute easy bounce, 30 seconds faster. Six times through.",timer:[["Easy",60],["Fast",30],["Easy",60],["Fast",30],["Easy",60],["Fast",30],["Easy",60],["Fast",30],["Easy",60],["Fast",30],["Easy",60],["Fast",30]]},
 {time:"8 min",how:"Steady bounce, feet staying light. Nothing hard.",timer:[["Bounce",480]]},
 {time:"10 min",how:"30 seconds bounce, 30 seconds high knees. Ten times through.",timer:[["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30],["Bounce",30],["High knees",30]]},
 {time:"9 min",how:"2 minutes easy, 1 minute faster. Three times through.",timer:[["Easy",120],["Faster",60],["Easy",120],["Faster",60],["Easy",120],["Faster",60]]}
];
var ROW=[
 {time:"7 min",how:"20 seconds hard, 40 seconds easy, five times. Then 2 minutes easy to finish.",timer:[["Hard",20],["Easy",40],["Hard",20],["Easy",40],["Hard",20],["Easy",40],["Hard",20],["Easy",40],["Hard",20],["Easy",40],["Easy finish",120]]},
 {time:"10 min",how:"Steady. Hold a pace you could talk at. Watch the meters, not the clock.",timer:[["Steady row",600]]},
 {time:"9 min",how:"250 m, then 1 minute easy. Three times through.",timer:[["250 m",120],["Easy",60],["250 m",120],["Easy",60],["250 m",120],["Easy",60]]},
 {time:"7 min",how:"1 minute on, 1 minute easy. Three and a half times through, finish on the easy minute.",timer:[["On",60],["Easy",60],["On",60],["Easy",60],["On",60],["Easy",60],["On",60]]}
];

/* ---------- helpers ---------- */
function pickIdx(pool,n){return pool[((n%pool.length)+pool.length)%pool.length];}
function loadJumped(mv,blk,wib){
  if(wib!==3||!mv.load||mv.load[0]===0)return false;
  var base=Math.min(blk,mv.load.length-1);
  return base+1<=mv.load.length-1;
}
function repsFor(mv,wib,blk){
  if(wib===3) return loadJumped(mv,blk,wib)?Math.max(4,mv.base-1):mv.base+3;
  return mv.base+[0,1,2][wib];
}
function loadFor(mv,blk,wib){
  if(!mv.load||mv.load[0]===0)return null;
  var base=Math.min(blk,mv.load.length-1);
  var idx=base;
  if(wib===3)idx=Math.min(base+1,mv.load.length-1);
  return mv.load[idx];
}
function loadText(mv,blk,wib){
  var l=loadFor(mv,blk,wib);
  if(l===null)return "Bodyweight";
  return l+" "+mv.unit;
}
function repText(mv,wib,blk){
  var r=repsFor(mv,wib,blk);
  return r+" reps"+(mv.unil?" each side":"");
}

/* ---------- anchor selection ---------- */
function anchorsFor(date,noImpact){
  var blk=blockIndex(date);
  function draw(pool){
    var p=noImpact?pool.filter(function(m){return !m.impact;}):pool.slice();
    /* ballistics locked out for the first two weeks entirely */
    if(weekIndex(date)<2)p=pool.filter(function(m){return !m.impact;});
    return pickIdx(p,blk);
  }
  return {squat:draw(SQUAT),hinge:draw(HINGE),push:draw(PUSH),pull:draw(PULL)};
}

/* ---------- finisher generation ---------- */
function finisherFor(date,dayKey,noImpact){
  var wk=weekIndex(date),wib=weekInBlock(date),blk=blockIndex(date);
  if(wib===3){
    var b=BENCH[blk%BENCH.length];
    return {benchmark:true,name:b.name,tag:b.type==="emom"?"EMOM "+b.mins:"AMRAP "+b.mins,mins:b.mins,
            how:b.how,items:b.items.map(function(i){return {text:i.t,q:i.q};}),
            timer:b.type==="emom"?emomSegs(b.mins):[["Go",b.mins*60]]};
  }
  var seed=wk*10+(dayKey==="tue"?1:2);
  var rng=mulberry32(seed);
  var pool=FIN.filter(function(m){
    if(m.impact&&(noImpact||wk<2))return false;
    return true;
  });
  var picked=[],used={};
  while(picked.length<3){
    var m=pool[Math.floor(rng()*pool.length)];
    if(used[m.id])continue;
    used[m.id]=true;picked.push(m);
  }
  var style=Math.floor(rng()*3);
  var items=picked.map(function(m){return {text:finText(m,rng),q:m.q};});
  if(style===0){
    return {tag:"AMRAP 6",mins:6,how:"As many rounds as you can in 6 minutes. Move steady, don't sprint the first round.",items:items,timer:[["Go",360]]};
  }
  if(style===1){
    var two=items.slice(0,2);
    return {tag:"EMOM 6",mins:6,how:"Every minute on the minute for 6 minutes. Rest whatever is left of each minute.",
            items:[{text:"Odd minutes: "+two[0].text,q:two[0].q},{text:"Even minutes: "+two[1].text,q:two[1].q}],
            timer:emomSegs(6)};
  }
  return {tag:"30 / 30 x 6",mins:6,how:"30 seconds of work, 30 seconds rest. Rotate through the list twice.",
          items:items,timer:intervalSegs(items,6)};
}
function finText(m,rng){
  if(m.kind==="hold")return "30 seconds "+m.name.toLowerCase()+(m.unil?" each side":"");
  if(m.kind==="cal")return (8+Math.floor(rng()*5))+" cal row";
  if(m.kind==="meters")return (150+Math.floor(rng()*3)*50)+" m row";
  var r=[8,10,12][Math.floor(rng()*3)];
  if(m.unil)r=Math.max(5,Math.round(r/2));
  return r+" "+m.name.toLowerCase()+(m.unil?" each side":"");
}
function emomSegs(mins){
  var s=[];
  for(var i=1;i<=mins;i++)s.push([(i%2===1?"Odd":"Even")+" \u00b7 minute "+i,60]);
  return s;
}
function intervalSegs(items,rounds){
  var s=[];
  for(var i=0;i<rounds;i++){
    s.push([items[i%items.length].text,30]);
    s.push(["Rest",30]);
  }
  return s;
}

/* ---------- session ---------- */
function sessionFor(date,noImpact,shortDay){
  var d=stripTime(date).getDay();
  var wib=weekInBlock(date),blk=blockIndex(date);
  if(d!==2&&d!==4)return null;
  var a=anchorsFor(date,noImpact);
  var A=(d===2)?a.squat:a.hinge;
  var B=(d===2)?a.push:a.pull;
  var rounds=shortDay?3:5;
  var s={
    dayKey:(d===2?"tue":"thu"),
    focus:(d===2?"Squat and press":"Hinge and pull"),
    rounds:rounds,
    warm:warmupFor(date),
    A:{mv:A,rep:repText(A,wib,blk),load:loadText(A,blk,wib)},
    B:{mv:B,rep:repText(B,wib,blk),load:loadText(B,blk,wib)},
    impact:!!(A.impact||B.impact)
  };
  s.strengthTimer=strengthSegs(s);
  s.fin=shortDay?null:finisherFor(date,s.dayKey,noImpact);
  s.mins=3+(shortDay?6:10)+(shortDay?0:6);
  return s;
}
function strengthSegs(s){
  var segs=[];
  for(var i=1;i<=s.rounds;i++){
    segs.push([s.A.mv.name+" \u00b7 round "+i+" of "+s.rounds,35]);
    segs.push(["Rest",25]);
    segs.push([s.B.mv.name+" \u00b7 round "+i+" of "+s.rounds,35]);
    if(i<s.rounds)segs.push(["Rest",25]);
  }
  return segs;
}
function warmupFor(date){
  var w=weekIndex(date)%3;
  var opts=[
    "2 minutes easy row or bounce, then 10 bodyweight squats and 10 hip hinges.",
    "2 minutes on the mini trampoline, then 10 glute bridges and 10 arm circles each way.",
    "2 minutes easy row, then 10 bodyweight squats, 8 push-ups on the bench, 10 arm circles."
  ];
  return opts[w];
}

/* ---------- optional day ---------- */
function optionsFor(date){
  var wk=weekIndex(date),d=stripTime(date).getDay();
  var off=wk+(d===1?0:d===3?1:2);
  var walk=pickIdx(WALK,off),reb=pickIdx(REB,off),row=pickIdx(ROW,off);
  return [
    {tool:"Walking pad",time:walk.time,how:walk.how,where:"Upstairs. No room to share, no setup.",timer:walk.timer||[["Walk",parseInt(walk.time)*60]],q:"walking pad workout"},
    {tool:"Mini trampoline",time:reb.time,how:reb.how,where:"Basement. Only if the room is free.",timer:reb.timer,q:"mini trampoline workout beginner"},
    {tool:"Rower",time:row.time,how:row.how,where:"Basement. Only if the room is free.",timer:row.timer,q:"concept2 rower form beginner"}
  ];
}

/* ---------- storage, best effort ---------- */
function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function read(k){try{return localStorage.getItem(k);}catch(e){return null;}}

/* ---------- render ---------- */
var DAYNAME=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTH=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var today=new Date();
var noImpact=false,shortDay=false;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function watchLink(q){return '<a class="ex-watch" target="_blank" rel="noopener" href="'+esc(yt(q))+'">Watch</a>';}

function exBlock(id,tag,name,rep,note,q){
  return '<div class="ex" id="'+id+'">'
    +'<button class="check" aria-label="Mark done" onclick="toggleDone(\''+id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="#0E1420" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>'
    +'<div class="ex-body">'
    +(tag?'<div class="pairtag">'+esc(tag)+'</div>':'')
    +'<div class="ex-name">'+esc(name)+'</div>'
    +(rep?'<div class="ex-rep">'+esc(rep)+'</div>':'')
    +(note?'<div class="ex-note">'+esc(note)+'</div>':'')
    +(q?watchLink(q):'')
    +'</div></div>';
}

function render(){
  var d=stripTime(today).getDay();
  var wk=weekIndex(today)+1,blk=blockIndex(today)+1,wib=weekInBlock(today)+1;
  document.getElementById("dateline").textContent=DAYNAME[d]+", "+MONTH[stripTime(today).getMonth()]+" "+stripTime(today).getDate();

  var main=document.getElementById("main");
  var isTraining=(d===2||d===4);
  document.getElementById("toggles").style.display=isTraining?"flex":"none";

  if(d===0||d===6){
    document.getElementById("eyebrow").textContent="Rest";
    document.getElementById("subline").textContent="Block "+blk+" \u00b7 Week "+wib+" of 4";
    main.innerHTML='<div class="rest"><h2>Nothing today</h2><p>Weekend. Move if you feel like it, skip it if you don\'t.</p></div>';
    updateProgress();renderWeek();return;
  }

  if(!isTraining){
    document.getElementById("eyebrow").textContent="Optional";
    document.getElementById("subline").textContent="Pick one, or skip it. Nothing here is required.";
    var opts=optionsFor(today),html="";
    for(var i=0;i<opts.length;i++){
      var o=opts[i];
      html+='<div class="opt">'
        +'<div class="opt-tool">'+esc(o.tool)+'</div>'
        +'<div class="opt-time">'+esc(o.time)+'</div>'
        +'<div class="opt-how">'+esc(o.how)+'</div>'
        +'<div class="opt-where">'+esc(o.where)+'</div>'
        +'<button class="btn ghost" onclick="startTimer('+i+',\'opt\')">Start timer</button>'
        +'</div>';
    }
    main.innerHTML=html;
    updateProgress();renderWeek();return;
  }

  var s=sessionFor(today,noImpact,shortDay);
  document.getElementById("eyebrow").textContent=s.focus;
  document.getElementById("subline").textContent="Block "+blk+" \u00b7 Week "+wib+" of 4 \u00b7 about "+s.mins+" minutes";

  var html="";
  html+='<div class="blockhead"><span class="blocktag warm">Warm up</span>'
      +'<div class="blockmeta">3 minutes</div>'
      +'<div class="blockhow">'+esc(s.warm)+'</div>'
      +'<button class="btn ghost" style="margin-top:12px;" onclick="startTimer(0,\'warm\')">Start 3 min</button></div>';

  html+='<div class="blockhead" style="margin-top:14px;"><span class="blocktag">Strength</span>'
      +'<div class="blockmeta">'+(shortDay?"About 6 minutes":"About 10 minutes")+' \u00b7 '+s.rounds+' rounds</div>'
      +'<div class="blockhow">Alternate the two lifts. Rest about 30 seconds between them. This is the part that builds you, so the last two rounds should be hard.</div></div>';

  html+=exBlock("exA","Lift A",s.A.mv.name,s.A.rep+" \u00b7 "+s.A.load,s.A.mv.cue,s.A.mv.q);
  html+=exBlock("exB","Lift B",s.B.mv.name,s.B.rep+" \u00b7 "+s.B.load,s.B.mv.cue,s.B.mv.q);
  if(s.impact)html+='<div class="flag">Ballistic work today. Stop the set if you feel heaviness or pressure. Swings stay at 35 lb, always.</div>';
  html+='<button class="btn" onclick="startTimer(0,\'strength\')">Start strength timer</button>';

  if(s.fin){
    var f=s.fin;
    html+='<div class="blockhead"><span class="blocktag fin">Finisher</span>'
      +(f.benchmark?'<div class="benchname">'+esc(f.name)+'</div>':'')
      +'<div class="blockmeta">'+esc(f.tag)+'</div>'
      +'<div class="blockhow">'+esc(f.how)+'</div></div>';
    for(var j=0;j<f.items.length;j++){
      html+=exBlock("fin"+j,null,f.items[j].text,null,null,f.items[j].q);
    }
    if(f.benchmark){
      var bIdx=blockIndex(today);
      var prev=scorePrev(f.name,bIdx);
      html+='<div class="score"><label for="scoreIn">Your score today</label>'
        +'<input id="scoreIn" type="text" placeholder="Rounds, reps, or time" value="'+esc(scoreCurrent(f.name,bIdx))+'" oninput="saveScore(\''+esc(f.name)+'\','+bIdx+',this.value)" />'
        +(prev?'<div class="prev">Last time you did '+esc(f.name)+': '+esc(prev)+'</div>':'<div class="prev">First time through. Whatever you write down becomes the number to beat.</div>')
        +'</div>';
    }
    html+='<button class="btn" onclick="startTimer(0,\'fin\')">Start finisher timer</button>';
  } else {
    html+='<div class="rest" style="margin-top:4px;"><h2>Short day</h2><p>No finisher. Three rounds and you are done. This still counts.</p></div>';
  }

  main.innerHTML=html;
  updateProgress();
  renderWeek();
}

function scoreHist(name){
  var raw=read("score:"+name);
  if(!raw)return [];
  try{var a=JSON.parse(raw);return Array.isArray(a)?a:[];}catch(e){return [];}
}
function scoreCurrent(name,blk){
  var h=scoreHist(name);
  for(var i=0;i<h.length;i++)if(h[i].b===blk)return h[i].v;
  return "";
}
function scorePrev(name,blk){
  var h=scoreHist(name),best=null;
  for(var i=0;i<h.length;i++)if(h[i].b<blk&&(!best||h[i].b>best.b))best=h[i];
  return best?best.v:null;
}
function saveScore(name,blk,val){
  var h=scoreHist(name),found=false;
  for(var i=0;i<h.length;i++)if(h[i].b===blk){h[i].v=val;found=true;}
  if(!found)h.push({b:blk,v:val});
  save("score:"+name,JSON.stringify(h));
}

function toggleDone(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.classList.toggle("done");
  updateProgress();
}
function updateProgress(){
  var all=document.querySelectorAll(".ex");
  var wrapEl=document.getElementById("progressWrap");
  if(!all.length){wrapEl.style.display="none";return;}
  wrapEl.style.display="flex";
  var done=document.querySelectorAll(".ex.done").length;
  document.getElementById("progressText").textContent=done+" of "+all.length;
  document.getElementById("progressBar").style.width=(done/all.length*100)+"%";
}

function renderWeek(){
  var mon=mondayOf(today);
  var labels=["Mon","Tue","Wed","Thu","Fri"];
  var html="";
  for(var i=0;i<5;i++){
    var dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    var isNow=(stripTime(dt).getTime()===stripTime(today).getTime());
    var txt;
    if(i===1||i===3){
      var s=sessionFor(dt,noImpact,false);
      txt=s.A.mv.name+" and "+s.B.mv.name.toLowerCase();
      if(s.fin&&s.fin.benchmark)txt+=" \u00b7 "+s.fin.name;
    } else {
      txt='<em>Optional \u00b7 walk, bounce, or row</em>';
    }
    html+='<div class="wrow'+(isNow?" now":"")+'"><div class="wday">'+labels[i]+'</div><div class="wtext">'+txt+'</div></div>';
  }
  document.getElementById("week").innerHTML=html;
}

/* ---------- timer engine ---------- */
var T={segs:[],i:0,left:0,running:false,tick:null,ctx:null};
function beep(freq,dur){
  try{
    if(!T.ctx)T.ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=T.ctx.createOscillator(),g=T.ctx.createGain();
    o.frequency.value=freq;o.type="sine";
    g.gain.setValueAtTime(0.0001,T.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3,T.ctx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,T.ctx.currentTime+dur);
    o.connect(g);g.connect(T.ctx.destination);
    o.start();o.stop(T.ctx.currentTime+dur+0.02);
  }catch(e){}
}
function clip(t,n){
  if(t.length<=n)return t;
  var cut=t.slice(0,n+1),sp=cut.lastIndexOf(" ");
  return (sp>6?cut.slice(0,sp):t.slice(0,n)).replace(/[\s,.-]+$/,"");
}
function mmss(s){var m=Math.floor(s/60);var r=s%60;return m+":"+(r<10?"0":"")+r;}
function isRest(label){return /^rest$|^easy/i.test(label);}

function startTimer(idx,kind){
  var segs=[],title="Timer";
  if(kind==="opt"){
    var o=optionsFor(today)[idx];
    segs=o.timer.slice();title=o.tool;
  } else if(kind==="warm"){
    segs=[["Warm up",180]];title="Warm up";
  } else if(kind==="strength"){
    var s=sessionFor(today,noImpact,shortDay);
    segs=s.strengthTimer.slice();title="Strength";
  } else if(kind==="fin"){
    var s2=sessionFor(today,noImpact,shortDay);
    if(!s2.fin)return;
    segs=s2.fin.timer.slice();title=s2.fin.benchmark?s2.fin.name:"Finisher";
  }
  T.segs=segs;T.i=0;T.left=segs[0][1];T.running=false;
  document.getElementById("tTitle").textContent=title;
  document.getElementById("tToggle").textContent="Start";
  document.getElementById("timer").classList.add("on");
  document.body.classList.add("locked");
  paintTimer();
}
function paintTimer(){
  var seg=T.segs[T.i];
  if(!seg)return;
  var label=seg[0],total=seg[1];
  var phase=document.getElementById("tPhase");
  var track=document.getElementById("tTrack");
  phase.className="t-phase"+(isRest(label)?" rest":"");
  track.className=isRest(label)?"rest":"";
  var head=label.split(" \u00b7 ")[0];
  phase.textContent=clip(head,20);
  document.getElementById("tSub").textContent=(label!==phase.textContent)?label:"";
  document.getElementById("tClock").textContent=mmss(T.left);
  document.getElementById("tCount").textContent="Step "+(T.i+1)+" of "+T.segs.length;
  track.style.width=(100-(T.left/total*100))+"%";
}
function timerStep(){
  T.left--;
  if(T.left<=3&&T.left>0)beep(660,0.07);
  if(T.left<=0){
    T.i++;
    if(T.i>=T.segs.length){
      stopTimer();
      beep(880,0.18);setTimeout(function(){beep(1100,0.25);},200);
      document.getElementById("tPhase").textContent="Done";
      document.getElementById("tClock").textContent="0:00";
      document.getElementById("tSub").textContent="";
      document.getElementById("tCount").textContent="Finished";
      document.getElementById("tToggle").textContent="Start";
      return;
    }
    beep(920,0.14);
    T.left=T.segs[T.i][1];
  }
  paintTimer();
}
function stopTimer(){T.running=false;if(T.tick){clearInterval(T.tick);T.tick=null;}}
document.getElementById("tToggle").addEventListener("click",function(){
  if(T.running){stopTimer();this.textContent="Resume";return;}
  if(T.i>=T.segs.length){T.i=0;T.left=T.segs[0][1];paintTimer();}
  beep(760,0.12);
  T.running=true;this.textContent="Pause";
  T.tick=setInterval(timerStep,1000);
});
document.getElementById("tSkip").addEventListener("click",function(){
  if(!T.segs.length)return;
  T.i++;
  if(T.i>=T.segs.length){T.i=T.segs.length-1;T.left=0;paintTimer();return;}
  T.left=T.segs[T.i][1];beep(920,0.1);paintTimer();
});
document.getElementById("tClose").addEventListener("click",function(){
  stopTimer();
  document.getElementById("timer").classList.remove("on");
  document.body.classList.remove("locked");
});

/* ---------- toggles ---------- */
document.getElementById("noimpact").addEventListener("change",function(){noImpact=this.checked;render();document.getElementById("noimpact").checked=noImpact;document.getElementById("shortday").checked=shortDay;});
document.getElementById("shortday").addEventListener("change",function(){shortDay=this.checked;render();document.getElementById("noimpact").checked=noImpact;document.getElementById("shortday").checked=shortDay;});

/* ---------- rollover ---------- */
var loadedKey=today.getDate()+"-"+today.getMonth()+"-"+today.getFullYear();
setInterval(function(){
  var d=new Date();
  var k=d.getDate()+"-"+d.getMonth()+"-"+d.getFullYear();
  if(k!==loadedKey)location.reload();
},60000);

render();
</script>
